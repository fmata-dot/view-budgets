[project]
name = "budget-sync"
version = "0.1.0"
description = "Reads labor/census budgets from the Master Budget Templates Google Sheet and pushes them into SQL Server."
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.25.0",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
